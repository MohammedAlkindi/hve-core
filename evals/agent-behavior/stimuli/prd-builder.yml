stimuli:
  - name: prd-builder-class-recipe
    prompt: |
      Draft a Product Requirements Document for a notification preferences page (in-app, email, SMS toggles). Include user stories and success criteria. Write the PRD under `docs/project-planning/` with session state under `.copilot-tracking/prd-sessions/`, and report the paths.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: tracking-file-write
        config:
          pattern: '(?i)(docs[-/\\]project-planning|\.copilot-tracking[-/\\](prd-sessions|research))'
      - type: output-matches
        name: topic-coverage
        config:
          pattern: '(?i)(product|requirement|user story|success|notification|preference)'
      - type: output-matches
        name: no-source-edit
        config:
          pattern: '(?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)'
          negate: true
  - name: prd-builder-proposal-response-contribution
    prompt: |
      Continue product evidence contribution for questionnaire Q1, "What
      availability and identity integration does the service support?" from the
      supplied persisted artifact path
      `.copilot-tracking/proposal-responses/identity-questionnaire/response-evidence.yml`.
      Its validated RESPONSE_EVIDENCE_V1 payload already contains SQ-001,
      CLM-001, and UNR-001. Preserve those stable IDs, add the
      operation-appropriate product record as CLM-002, and return the same
      path. Its prior coverage is question_count 1, addressed_count 0,
      qualified_count 0, unresolved_count 1, and addressed_percent 0.0. The
      supplied evidence below satisfies the UNR-001 clearing action, so
      recalculate coverage after contribution as question_count 1,
      addressed_count 0, qualified_count 0, unresolved_count 0, and
      addressed_percent 0.0. Contribution adds no response record, so SQ-001
      does not become addressed or qualified.
      Approved PRD evidence: NFR-014 targets 99.9%
      monthly availability; FR-022 requires Microsoft Entra ID integration;
      AC-031 verifies SSO login.

      The existing builder state is:
      `extensionsLoaded: [proposal-response#contribute:product]` and
      `proposalResponseArtifacts: [.copilot-tracking/proposal-responses/identity-questionnaire/response-evidence.yml]`.
      Pass the same path to the contribution, retain that extension and path
      exactly once in their respective arrays, and do not inline the full
      payload.
    environment:
      skills:
        - ../../.github/skills/project-planning/proposal-response
      files:
        - src: fixtures/proposal-response-identity-questionnaire-response-evidence.txt
          dest: .copilot-tracking/proposal-responses/identity-questionnaire/response-evidence.yml
    tags:
      category: agent-behavior
      scenario: prd-proposal-positive
    graders:
      - type: output-matches
        name: product-extension-activation
        config:
          pattern: '(?i)(proposal-response#contribute:product|proposal-response.*(product|contribute))'
      - type: output-matches
        name: authority-boundary
        config:
          pattern: '(?i)(internal.review|outside.*scope|not.*(approved|authorized|release)|external.use.prohibited)'
      - type: output-matches
        name: same-artifact-pointer
        config:
          pattern: '(?i)identity-questionnaire[/\\]response-evidence\.yml'
      - type: output-matches
        name: pointer-contract-returned
        config:
          pattern: '(?i)RESPONSE_EVIDENCE_POINTER_V1'
      - type: output-matches
        name: retained-extension-entry
        config:
          pattern: '(?is)extensionsLoaded\s*:\s*\[[^\]]*proposal-response#contribute:product[^\]]*\]'
      - type: output-matches
        name: retained-artifact-entry
        config:
          pattern: '(?is)proposalResponseArtifacts\s*:\s*\[[^\]]*identity-questionnaire[/\\]response-evidence\.yml[^\]]*\]'
      - type: output-matches
        name: builder-state-not-duplicated
        config:
          pattern: '(?is)extensionsLoaded\s*:\s*\[[^\]]*proposal-response#contribute:product[^\]]*proposal-response#contribute:product|proposalResponseArtifacts\s*:\s*\[[^\]]*identity-questionnaire[/\\]response-evidence\.yml[^\]]*identity-questionnaire[/\\]response-evidence\.yml'
          negate: true
      - type: output-matches
        name: operation-appropriate-addition
        config:
          pattern: '(?is)changed_record_ids.*CLM-0*2'
      - type: output-matches
        name: preservation-reported-as-counts
        config:
          pattern: '(?is)record_counts:.*claims:\s*2'
      - type: output-matches
        name: recalculated-coverage
        config:
          pattern: '(?is)coverage:.*question_count:\s*1.*unresolved_count:\s*0'
      - type: output-matches
        name: next-operation-reported
        config:
          pattern: '(?i)next_operation:\s*(analyze|contribute|draft|none)'
      - type: output-matches
        name: unresolved-cleared-by-approved-evidence
        config:
          pattern: '(?is)UNR-0*1.*(clear|cleared|resolved|closed|satisfied)|(clear|cleared|resolved|closed|satisfied).*UNR-0*1'
  - name: prd-builder-proposal-response-rejected-continuation
    prompt: |
      Continue product evidence contribution for questionnaire Q1, "What
      availability and identity integration does the service support?" from the
      supplied persisted artifact path
      `.copilot-tracking/proposal-responses/atlas-rfp/response-evidence.yml`.
      Approved PRD evidence: NFR-014 targets 99.9% monthly availability.

      The existing builder state has no `proposalResponseArtifacts` array and
      `extensionsLoaded: []`. Report the resulting builder state fields and the
      skill result exactly as they stand after this attempt.
    environment:
      skills:
        - ../../.github/skills/project-planning/proposal-response
      files:
        - src: fixtures/proposal-response-atlas-rfp-invalid-evidence.txt
          dest: .copilot-tracking/proposal-responses/atlas-rfp/response-evidence.yml
    tags:
      category: agent-behavior
      scenario: prd-proposal-rejected-continuation
    graders:
      - type: output-matches
        name: rejection-reported
        config:
          pattern: '(?i)RESPONSE_EVIDENCE_ERROR_V1'
      - type: output-matches
        name: no-artifact-written
        config:
          pattern: '(?i)(artifact_written\s*:\s*false|not written|no artifact was written)'
      - type: output-matches
        name: validation-error-reported
        config:
          pattern: '(?i)(validation_error|unknown_schema)'
      - type: output-matches
        name: clearing-action-reported
        config:
          pattern: '(?i)(supply|provide|replace with).*(complete|valid).*RESPONSE_EVIDENCE_V1'
      - type: output-matches
        name: rejected-path-not-recorded
        config:
          pattern: '(?is)proposalResponseArtifacts\s*:\s*\[[^\]]*atlas-rfp[/\\]response-evidence\.yml'
          negate: true
  - name: prd-builder-proposal-response-source-intake-analyze
    prompt: |
      Analyze this questionnaire for a bid response: Q1 asks what monthly
      availability the service commits to, and Q2 asks which identity provider
      it federates with. The approved source is the existing PRD at
      `docs/project-planning/northwind-identity-prd.md`; read and register it
      before citing it. Persist under `.copilot-tracking/proposal-responses/`,
      report the builder state fields, and tell me what to run next.
    environment:
      skills:
        - ../../.github/skills/project-planning/proposal-response
      files:
        - src: fixtures/proposal-response-northwind-identity-prd.txt
          dest: docs/project-planning/northwind-identity-prd.md
    tags:
      category: agent-behavior
      scenario: prd-proposal-source-intake
    graders:
      - type: output-matches
        name: analyze-operation-performed
        config:
          pattern: '(?i)operation:\s*analyze'
      - type: output-matches
        name: source-registered
        config:
          pattern: '(?i)SRC-0*1'
      - type: output-matches
        name: source-path-recorded
        config:
          pattern: '(?i)northwind-identity-prd\.md'
      - type: output-matches
        name: next-operation-reported
        config:
          pattern: '(?i)next_operation:\s*(contribute|draft|none)'
      - type: output-matches
        name: not-redirected-to-direct-skill-use
        config:
          pattern: '(?i)(cannot|can.t|unable to|not able to)\s+(run|perform|invoke)\s+analyze'
          negate: true
  - name: prd-builder-proposal-response-draft
    prompt: |
      Draft the proposal responses for the identity questionnaire. The stored
      payload at
      `.copilot-tracking/proposal-responses/identity-questionnaire/response-evidence.yml`
      holds SQ-001 answered by product-owned CLM-001 and SQ-002 answered by
      business-owned CLM-002; both claims are reviewed and supported. Do not
      render any appendix or draft file. Report the builder state fields and the
      skill result.
    environment:
      skills:
        - ../../.github/skills/project-planning/proposal-response
    tags:
      category: agent-behavior
      scenario: prd-proposal-draft
    graders:
      - type: output-matches
        name: draft-operation-performed
        config:
          pattern: '(?i)operation:\s*draft'
      - type: output-matches
        name: cross-domain-question-drafted
        config:
          pattern: '(?i)RSP-0*2'
      - type: output-matches
        name: no-rendering-without-request
        config:
          pattern: '(?i)rendered_artifacts:\s*\[\s*\]'
      - type: output-matches
        name: no-business-claim-authored
        config:
          pattern: '(?is)changed_record_ids[^\n]*CLM-0*3'
          negate: true
  - name: prd-builder-ordinary-request-no-proposal-extension
    prompt: |
      Resume my notification preferences PRD and refine its user stories,
      acceptance criteria, and success metrics. Do not create an appendix.
    tags:
      category: agent-behavior
      scenario: prd-proposal-negative
    graders:
      - type: output-matches
        name: ordinary-prd-work
        config:
          pattern: '(?i)(PRD|user stor|acceptance criteria|success metric|Build|Validate)'
      - type: output-matches
        name: no-proposal-extension
        config:
          pattern: '(?i)(proposal-response|RESPONSE_EVIDENCE_V1|extensionsLoaded)'
          negate: true
