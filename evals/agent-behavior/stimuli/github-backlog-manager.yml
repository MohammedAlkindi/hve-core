stimuli:
  - name: github-backlog-manager-class-recipe
    prompt: |
      The app crashes when clicking the Submit button on the contact form. Generate a GitHub issue draft with title, body, labels, and steps to reproduce. Write the issue draft under `.copilot-tracking/github-issues/`, then report the path and the drafted fields.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: field-vocab-present
        config:
          pattern: '(?i)(title|body|label|milestone|assignee|steps to reproduce|expected|actual)'
      - type: output-matches
        name: tracking-file-write
        config:
          pattern: '(?i)\.copilot-tracking[-/\\](github-issues|workitems)'
      - type: output-matches
        name: no-source-edit
        config:
          pattern: '(?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)'
          negate: true

  - name: github-backlog-manager-routes-grooming-digest
    prompt: |
      Review the latest weekly backlog grooming digest for this repository. It
      covers 120 open issues and recommends a title clarification for #2558 and
      a maintainer comment on #2601. Classify the workflow, explain the allowed
      handoff operations, and state the approval and freshness checks required
      before writeback. Do not execute any GitHub mutation.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: grooming-route
        config:
          pattern: '(?i)\bgrooming\b|backlog health|grooming digest'
      - type: output-matches
        name: non-closing-handoff
        config:
          pattern: '(?is)(Update|Comment).{0,200}(never|not|prohibit|exclude).{0,80}Close|(never|not|prohibit|exclude).{0,80}Close.{0,200}(Update|Comment)'
      - type: output-matches
        name: approval-freshness
        config:
          pattern: '(?i)per-field approval|Expected Updated At|updated_at|fresh|stale approval'
      - type: output-matches
        name: no-github-mutation
        config:
          pattern: '(?i)(updated|closed|commented on)\s+(github\s+)?issue\s*#?\d+'
          negate: true
