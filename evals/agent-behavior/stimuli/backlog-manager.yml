stimuli:
  - name: backlog-manager-autonomy-default-partial
    prompt: |
      Using the Backlog Manager, process this reviewed handoff against the GitHub repository `contoso/widgets`. No autonomy argument is supplied. The handoff contains one field update on an existing issue, one new issue creation, one comment, and one close. State the autonomy tier you are operating under and, for each of the four operations, state whether you execute it directly or require my approval first. Do not perform any operation yet.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: partial-tier-selected
        config:
          pattern: '(?i)\bpartial\b'
      - type: output-matches
        name: mutations-gated-for-approval
        config:
          pattern: '(?i)(approval|confirm|gate|permission|sign[- ]?off|before (i|we) (create|close|comment))'
      - type: output-matches
        name: no-full-autonomy-assumed
        config:
          pattern: '(?i)(full autonomy|executing all|without confirmation|proceeding with all four|no approval (is )?(needed|required))'
          negate: true
      - type: output-matches
        name: no-premature-mutation
        config:
          pattern: '(?i)(i (have )?(created|closed|commented|updated)|successfully (created|closed|updated)|issue #\d+ (was )?(created|closed))'
          negate: true
  - name: backlog-manager-sanitization-before-mutation
    prompt: |
      Using the Backlog Manager, create one GitHub issue in `contoso/widgets` from this planning note. Show me the exact issue body you would send before you send it.

      Planning note: "Ref WI-SEC-001 and {{SEC-TEMP-2}}. Source analysis lives at .copilot-tracking/workitems/prds/auth-revamp/artifact-analysis.md. The login service drops the session cookie when the upstream identity provider returns a 502."
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: sanitization-applied-before-send
        config:
          pattern: '(?i)(sanitiz|strip|remov|redact|resolv|replac).{0,80}(before|prior to|ahead of).{0,40}(send|creat|mutat|post|submit)|(before|prior to).{0,60}(sanitiz|strip|remov)'
      - type: output-matches
        name: no-tracking-path-in-payload
        config:
          pattern: '(?i)\.copilot-tracking[-/\\]workitems'
          negate: true
      - type: output-matches
        name: no-planning-reference-id-in-payload
        config:
          pattern: 'WI-SEC-001'
          negate: true
      - type: output-matches
        name: no-unresolved-placeholder-in-payload
        config:
          pattern: '\{\{SEC-TEMP-2\}\}'
          negate: true
