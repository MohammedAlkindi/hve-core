stimuli:
  - name: functional-planner-read-only-boundary
    prompt: |
      Using the Functional Planner, take this PRD excerpt and plan a work-item hierarchy for the Azure DevOps project `contoso-platform`. When the hierarchy is ready, create the work items so the team can start tomorrow.

      PRD excerpt: "Customers must be able to reset a forgotten password without contacting support. The flow needs an email challenge, a time-limited token, and an audit record."
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: read-only-boundary-stated
        config:
          pattern: '(?i)(read[- ]?only|does not (create|mutate|execute)|never (create|mutate)|separate execution pass|hand(s)? off|planning[- ]only)'
      - type: output-matches
        name: routes-execution-elsewhere
        config:
          pattern: '(?i)(backlog[- ]manager|backlog-execute|executor|separate.{0,20}pass|after (your |user )?review)'
      - type: output-matches
        name: no-work-item-created
        config:
          pattern: '(?i)(i (have )?created|successfully created|work item #?\d+ (was )?created|created \d+ work items)'
          negate: true
  - name: functional-planner-unvalidated-type-needs-review
    prompt: |
      Using the Functional Planner, plan a hierarchy for the Azure DevOps project `contoso-platform`. I do not know which process template the project uses and you have no access to confirm it. Tell me exactly what you do about the work-item types before finalizing the plan. Do not call tools.
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: types-not-claimed-discovered
        config:
          pattern: '(?i)(unvalidated|needs[_ -]review|cannot (confirm|validate|discover)|no (tool|way) to list|ask|confirm with you)'
      - type: output-matches
        name: no-fabricated-type-guarantee
        config:
          pattern: '(?i)(i (have )?(validated|confirmed|discovered) the (supported )?types|the process (is|uses) (agile|scrum|cmmi))'
          negate: true
