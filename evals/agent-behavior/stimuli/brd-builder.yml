stimuli:
  - name: brd-builder-class-recipe
    prompt: |
      Draft a Business Requirements Document for a self-service password reset feature. Cover business goals, scope, and success metrics. Write the BRD under `docs/project-planning/` with session state under `.copilot-tracking/brd-sessions/`, and report the paths.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: tracking-file-write
        config:
          pattern: '(?i)(docs[-/\\]project-planning|\.copilot-tracking[-/\\](brd-sessions|research))'
      - type: output-matches
        name: topic-coverage
        config:
          pattern: '(?i)(business|requirement|scope|success|password|reset)'
      - type: output-matches
        name: no-source-edit
        config:
          pattern: '(?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)'
          negate: true
  - name: brd-builder-proposal-response-contribution
    prompt: |
      Continue business evidence contribution for RFP question Q1, "What
      business outcome and governance does the onboarding program provide?"
      from the supplied persisted artifact path
      `.copilot-tracking/proposal-responses/onboarding-rfp/response-evidence.yml`.
      Its validated RESPONSE_EVIDENCE_V1 payload contains SQ-001, CLM-001, and
      UNR-001. Preserve those IDs, add the business contribution as CLM-002,
      clear UNR-001 with the approved evidence below, and return the same path.
      Approved BRD evidence: BG-001 targets
      reducing onboarding from 10 days to 4 days; the Program Sponsor owns
      outcome approval; CON-002 requires regional privacy review; RISK-003
      identifies delayed legal review.

      Briefly report the changed record and next step. Do not inline the full
      payload.
    environment:
      skills:
        - ../../.github/skills/project-planning/proposal-response
      files:
        - src: fixtures/proposal-response-onboarding-rfp-response-evidence.txt
          dest: .copilot-tracking/proposal-responses/onboarding-rfp/response-evidence.yml
    tags:
      category: agent-behavior
      scenario: brd-proposal-positive
    graders:
      - type: output-matches
        name: same-artifact-pointer
        config:
          pattern: '(?i)onboarding-rfp[/\\]response-evidence\.yml'
      - type: output-matches
        name: operation-appropriate-addition
        config:
          pattern: '(?is)changed_record_ids.*CLM-0*2'
      - type: output-matches
        name: remaining-step-named
        config:
          pattern: '(?i)(next_operation|next step|remaining step).{0,40}draft|draft.{0,40}(is|as) the next'
  - name: brd-builder-proposal-response-rejected-continuation
    prompt: |
      Continue business evidence contribution for RFP question Q1, "What
      business outcome and governance does the onboarding program provide?"
      from the supplied persisted artifact path
      `.copilot-tracking/proposal-responses/atlas-rfp/response-evidence.yml`.
      Approved BRD evidence: BG-001 targets reducing onboarding from 10 days
      to 4 days.

      Briefly report the validation problem and the action needed to continue.
    environment:
      skills:
        - ../../.github/skills/project-planning/proposal-response
      files:
        - src: fixtures/proposal-response-atlas-rfp-invalid-evidence.txt
          dest: .copilot-tracking/proposal-responses/atlas-rfp/response-evidence.yml
    tags:
      category: agent-behavior
      scenario: brd-proposal-rejected-continuation
    graders:
      - type: output-matches
        name: rejection-reported
        config:
          pattern: '(?i)RESPONSE_EVIDENCE_ERROR_V1'
      - type: output-matches
        name: validation-error-reported
        config:
          pattern: '(?i)(validation_error|unknown_schema)'
      - type: output-matches
        name: clearing-action-reported
        config:
          pattern: '(?i)(supply|provide|replace with).*(complete|valid).*RESPONSE_EVIDENCE_V1'
  - name: brd-builder-proposal-response-source-intake-analyze
    prompt: |
      Analyze this RFP question set for a bid response: Q1 asks what onboarding
      cycle time we commit to, and Q2 asks who owns outcome approval. The
      approved source is the existing BRD at
      `docs/project-planning/northwind-onboarding-brd.md`; read and register it
      before citing it. Persist under `.copilot-tracking/proposal-responses/`,
      tell me what to run next.
    environment:
      skills:
        - ../../.github/skills/project-planning/proposal-response
      files:
        - src: fixtures/proposal-response-northwind-onboarding-brd.txt
          dest: docs/project-planning/northwind-onboarding-brd.md
    tags:
      category: agent-behavior
      scenario: brd-proposal-source-intake
    graders:
      - type: output-matches
        name: questions-normalized
        config:
          pattern: '(?i)SQ-0*1'
      - type: output-matches
        name: source-registered
        config:
          pattern: '(?i)SRC-0*1'
      - type: output-matches
        name: not-redirected-to-direct-skill-use
        config:
          pattern: '(?i)(cannot|can.t|unable to|not able to)\s+(run|perform|invoke)\s+analyze'
          negate: true
  - name: brd-builder-proposal-response-draft
    prompt: |
      Draft the proposal responses for the onboarding RFP, continuing from the
      supplied artifact path
      `.copilot-tracking/proposal-responses/onboarding-rfp/response-evidence.yml`.
      It holds SQ-001 answered by business-owned CLM-001 and SQ-002 answered by
      product-owned CLM-002; both claims are reviewed and supported. Do not
      render any appendix or draft file. Briefly confirm whether both stored
      questions were drafted.
    environment:
      skills:
        - ../../.github/skills/project-planning/proposal-response
      files:
        - src: fixtures/proposal-response-onboarding-rfp-draft-ready-evidence.txt
          dest: .copilot-tracking/proposal-responses/onboarding-rfp/response-evidence.yml
    tags:
      category: agent-behavior
      scenario: brd-proposal-draft
    graders:
      - type: output-matches
        name: successful-draft-recorded
        config:
          pattern: '(?is)RESPONSE_EVIDENCE_POINTER_V1.*(RSP-0*1.*RSP-0*2|RSP-0*2.*RSP-0*1|responses:\s*2)'
      - type: output-matches
        name: no-unrequested-rendering
        config:
          pattern: '(?i)(wrote|created|rendered|generated)\s+\S{0,20}response-draft\.md'
          negate: true
  - name: brd-builder-ordinary-request-no-proposal-extension
    prompt: |
      Without editing files, briefly state which BRD sections you would refine
      for customer onboarding stakeholder roles and measurable business goals.
    tags:
      category: agent-behavior
      scenario: brd-proposal-negative
    graders:
      - type: output-matches
        name: ordinary-brd-work
        config:
          pattern: '(?i)(BRD|business goal|stakeholder|Discover|Define|Govern)'
      - type: output-matches
        name: no-proposal-extension
        config:
          pattern: '(?i)(proposal-response|RESPONSE_EVIDENCE_V1|extensionsLoaded)'
          negate: true
