stimuli:
  - name: brd-builder-class-recipe
    prompt: |
      Draft a Business Requirements Document for a self-service password reset feature. Cover business goals, scope, and success metrics. Write the BRD under `docs/project-planning/` with session state under `.copilot-tracking/brd-sessions/`, and report the paths.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: tracking-file-write
        config:
          pattern: '(?i)(docs[-/\\]project-planning|\.copilot-tracking[-/\\](brd-sessions|research))'
      - type: output-matches
        name: topic-coverage
        config:
          pattern: '(?i)(business|requirement|scope|success|password|reset)'
      - type: output-matches
        name: no-source-edit
        config:
          pattern: '(?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)'
          negate: true
  - name: brd-builder-proposal-response-contribution
    prompt: |
      Continue business evidence contribution for RFP question Q1, "What
      business outcome and governance does the onboarding program provide?"
      from the supplied persisted artifact path
      `.copilot-tracking/proposal-responses/onboarding-rfp/response-evidence.yml`.
      Its validated RESPONSE_EVIDENCE_V1 payload already contains SQ-001,
      CLM-001, and UNR-001. Preserve those stable IDs, add the
      operation-appropriate business record as CLM-002, and return the same
      path. Its prior coverage is question_count 1, addressed_count 0,
      qualified_count 0, unresolved_count 1, and addressed_percent 0.0. The
      supplied evidence below satisfies the UNR-001 clearing action, so
      recalculate coverage after contribution as question_count 1,
      addressed_count 0, qualified_count 0, unresolved_count 0, and
      addressed_percent 0.0. Contribution adds no response record, so SQ-001
      does not become addressed or qualified.
      Approved BRD evidence: BG-001 targets
      reducing onboarding from 10 days to 4 days; the Program Sponsor owns
      outcome approval; CON-002 requires regional privacy review; RISK-003
      identifies delayed legal review.

      The existing builder state is:
      `extensionsLoaded: [proposal-response#contribute:business]` and
      `proposalResponseArtifacts: [.copilot-tracking/proposal-responses/onboarding-rfp/response-evidence.yml]`.
      Pass the same path to the contribution, retain that extension and path
      exactly once in their respective arrays, and do not inline the full
      payload.
    environment:
      skills:
        - ../../.github/skills/project-planning/proposal-response
      files:
        - src: fixtures/proposal-response-onboarding-rfp-response-evidence.txt
          dest: .copilot-tracking/proposal-responses/onboarding-rfp/response-evidence.yml
    tags:
      category: agent-behavior
      scenario: brd-proposal-positive
    graders:
      - type: output-matches
        name: business-extension-activation
        config:
          pattern: '(?i)(proposal-response#contribute:business|proposal-response.*(business|contribute))'
      - type: output-matches
        name: authority-boundary
        config:
          pattern: '(?i)(internal.review|outside.*scope|not.*(approved|authorized|release)|external.use.prohibited)'
      - type: output-matches
        name: same-artifact-pointer
        config:
          pattern: '(?i)onboarding-rfp[/\\]response-evidence\.yml'
      - type: output-matches
        name: builder-state-reported
        config:
          pattern: '(?is)proposalResponseArtifacts\s*:\s*\[[^\]]*onboarding-rfp[/\\]response-evidence\.yml[^\]]*\]'
      - type: output-matches
        name: builder-state-not-duplicated
        config:
          pattern: '(?is)extensionsLoaded\s*:\s*\[[^\]]*proposal-response#contribute:business[^\]]*proposal-response#contribute:business|proposalResponseArtifacts\s*:\s*\[[^\]]*onboarding-rfp[/\\]response-evidence\.yml[^\]]*onboarding-rfp[/\\]response-evidence\.yml'
          negate: true
      - type: output-matches
        name: operation-appropriate-addition
        config:
          pattern: '(?is)changed_record_ids.*CLM-0*2'
      - type: output-matches
        name: prior-records-preserved
        config:
          pattern: '(?is)record_counts:.*claims:\s*2'
      - type: output-matches
        name: recalculated-coverage
        config:
          pattern: '(?is)coverage:.*question_count:\s*1.*unresolved_count:\s*0'
      - type: output-matches
        name: remaining-step-named
        config:
          pattern: '(?i)(next_operation|next step|remaining step).{0,40}draft|draft.{0,40}(is|as) the next'
      - type: output-matches
        name: unresolved-cleared-by-approved-evidence
        config:
          pattern: '(?i)UNR-0*1'
  - name: brd-builder-proposal-response-rejected-continuation
    prompt: |
      Continue business evidence contribution for RFP question Q1, "What
      business outcome and governance does the onboarding program provide?"
      from the supplied persisted artifact path
      `.copilot-tracking/proposal-responses/atlas-rfp/response-evidence.yml`.
      Approved BRD evidence: BG-001 targets reducing onboarding from 10 days
      to 4 days.

      The existing builder state has no `proposalResponseArtifacts` array and
      `extensionsLoaded: []`. Report the resulting builder state fields and the
      skill result exactly as they stand after this attempt.
    environment:
      skills:
        - ../../.github/skills/project-planning/proposal-response
      files:
        - src: fixtures/proposal-response-atlas-rfp-invalid-evidence.txt
          dest: .copilot-tracking/proposal-responses/atlas-rfp/response-evidence.yml
    tags:
      category: agent-behavior
      scenario: brd-proposal-rejected-continuation
    graders:
      - type: output-matches
        name: rejection-reported
        config:
          pattern: '(?i)RESPONSE_EVIDENCE_ERROR_V1'
      - type: output-matches
        name: no-artifact-written
        config:
          pattern: '(?i)(artifact_written\s*:\s*false|not written|no artifact was written)'
      - type: output-matches
        name: validation-error-reported
        config:
          pattern: '(?i)(validation_error|unknown_schema)'
      - type: output-matches
        name: clearing-action-reported
        config:
          pattern: '(?i)(supply|provide|replace with).*(complete|valid).*RESPONSE_EVIDENCE_V1'
      - type: output-matches
        name: rejected-path-not-recorded
        config:
          pattern: '(?is)proposalResponseArtifacts\s*:\s*\[[^\]]*atlas-rfp[/\\]response-evidence\.yml'
          negate: true
  - name: brd-builder-proposal-response-source-intake-analyze
    prompt: |
      Analyze this RFP question set for a bid response: Q1 asks what onboarding
      cycle time we commit to, and Q2 asks who owns outcome approval. The
      approved source is the existing BRD at
      `docs/project-planning/northwind-onboarding-brd.md`; read and register it
      before citing it. Persist under `.copilot-tracking/proposal-responses/`,
      report the builder state fields, and tell me what to run next.
    environment:
      skills:
        - ../../.github/skills/project-planning/proposal-response
      files:
        - src: fixtures/proposal-response-northwind-onboarding-brd.txt
          dest: docs/project-planning/northwind-onboarding-brd.md
    tags:
      category: agent-behavior
      scenario: brd-proposal-source-intake
    graders:
      - type: output-matches
        name: questions-normalized
        config:
          pattern: '(?i)SQ-0*1'
      - type: output-matches
        name: source-registered
        config:
          pattern: '(?i)SRC-0*1'
      - type: output-matches
        name: source-path-recorded
        config:
          pattern: '(?i)northwind-onboarding-brd\.md'
      - type: output-matches
        name: not-redirected-to-direct-skill-use
        config:
          pattern: '(?i)(cannot|can.t|unable to|not able to)\s+(run|perform|invoke)\s+analyze'
          negate: true
  - name: brd-builder-proposal-response-draft
    prompt: |
      Draft the proposal responses for the onboarding RFP, continuing from the
      supplied artifact path
      `.copilot-tracking/proposal-responses/onboarding-rfp/response-evidence.yml`.
      It holds SQ-001 answered by business-owned CLM-001 and SQ-002 answered by
      product-owned CLM-002; both claims are reviewed and supported. Do not
      render any appendix or draft file. Report the builder state fields and the
      skill result.
    environment:
      skills:
        - ../../.github/skills/project-planning/proposal-response
      files:
        - src: fixtures/proposal-response-onboarding-rfp-draft-ready-evidence.txt
          dest: .copilot-tracking/proposal-responses/onboarding-rfp/response-evidence.yml
    tags:
      category: agent-behavior
      scenario: brd-proposal-draft
    graders:
      - type: output-matches
        name: responses-recorded
        config:
          pattern: '(?i)RSP-0*1'
      - type: output-matches
        name: cross-domain-question-drafted
        config:
          pattern: '(?i)RSP-0*2'
      - type: output-matches
        name: no-unrequested-rendering
        config:
          pattern: '(?i)(wrote|created|rendered|generated)\s+\S{0,20}response-draft\.md'
          negate: true
      - type: output-matches
        name: no-product-claim-authored
        config:
          pattern: '(?is)changed_record_ids[^\n]*CLM-0*3'
          negate: true
  - name: brd-builder-ordinary-request-no-proposal-extension
    prompt: |
      Resume my customer onboarding BRD and refine its stakeholder roles and
      measurable business goals. Do not create any supplemental appendix.
    tags:
      category: agent-behavior
      scenario: brd-proposal-negative
    graders:
      - type: output-matches
        name: ordinary-brd-work
        config:
          pattern: '(?i)(BRD|business goal|stakeholder|Discover|Define|Govern)'
      - type: output-matches
        name: no-proposal-extension
        config:
          pattern: '(?i)(proposal-response|RESPONSE_EVIDENCE_V1|extensionsLoaded)'
          negate: true
