stimuli:
  - name: brd-builder-class-recipe
    prompt: |
      Draft a Business Requirements Document for a self-service password reset feature. Cover business goals, scope, and success metrics. Write the BRD under `docs/project-planning/` with session state under `.copilot-tracking/brd-sessions/`, and report the paths.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: tracking-file-write
        config:
          pattern: '(?i)(docs[-/\\]project-planning|\.copilot-tracking[-/\\](brd-sessions|research))'
      - type: output-matches
        name: topic-coverage
        config:
          pattern: '(?i)(business|requirement|scope|success|password|reset)'
      - type: output-matches
        name: no-source-edit
        config:
          pattern: '(?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)'
          negate: true
  - name: brd-builder-proposal-response-contribution
    prompt: |
      Continue business evidence contribution for RFP question Q1, "What
      business outcome and governance does the onboarding program provide?"
      from the supplied persisted artifact path
      `.copilot-tracking/proposal-responses/onboarding-rfp/response-evidence.yml`.
      Its validated RESPONSE_EVIDENCE_V1 payload already contains SQ-001,
      CLM-001, and UNR-001. Preserve those stable IDs and the unresolved item,
      add the operation-appropriate business record as CLM-002, and return the
      same path. Its prior coverage is question_count 1, addressed_count 0,
      qualified_count 0, unresolved_count 1, and addressed_percent 0.0.
      Recalculate it after contribution as question_count 1, addressed_count
      0, qualified_count 1, unresolved_count 0, and addressed_percent 0.0.
      Approved BRD evidence: BG-001 targets
      reducing onboarding from 10 days to 4 days; the Program Sponsor owns
      outcome approval; CON-002 requires regional privacy review; RISK-003
      identifies delayed legal review.

      The existing builder state is:
      `extensionsLoaded: [proposal-response#contribute:business]` and
      `proposalResponseArtifacts: [.copilot-tracking/proposal-responses/onboarding-rfp/response-evidence.yml]`.
      Pass the same path to the contribution, retain that extension and path
      exactly once in their respective arrays, and do not inline the full
      payload.
    environment:
      skills:
        - ../../.github/skills/project-planning/proposal-response
      files:
        - src: fixtures/proposal-response-onboarding-rfp-response-evidence.txt
          dest: .copilot-tracking/proposal-responses/onboarding-rfp/response-evidence.yml
    tags:
      category: agent-behavior
      scenario: brd-proposal-positive
    graders:
      - type: output-matches
        name: business-extension-activation
        config:
          pattern: '(?i)(proposal-response#contribute:business|proposal-response.*(business|contribute))'
      - type: output-matches
        name: authority-boundary
        config:
          pattern: '(?i)(internal.review|outside.*scope|not.*(approved|authorized|release)|external.use.prohibited)'
      - type: output-matches
        name: same-artifact-pointer
        config:
          pattern: '(?is)(RESPONSE_EVIDENCE_POINTER_V1|artifact_path).*onboarding-rfp[/\\]response-evidence\.yml'
      - type: output-matches
        name: retained-builder-state-once
        config:
          pattern: '(?is)extensionsLoaded\s*:\s*\[(?![^\]]*proposal-response#contribute:business[^\]]*proposal-response#contribute:business)[^\]]*proposal-response#contribute:business[^\]]*\].*proposalResponseArtifacts\s*:\s*\[(?![^\]]*onboarding-rfp[/\\]response-evidence\.yml[^\]]*onboarding-rfp[/\\]response-evidence\.yml)[^\]]*onboarding-rfp[/\\]response-evidence\.yml[^\]]*\]'
      - type: output-matches
        name: preserved-records-and-recalculated-coverage
        config:
          pattern: '(?is)(SQ-0*1.*CLM-0*1.*UNR-0*1|UNR-0*1.*CLM-0*1.*SQ-0*1).*changed_record_ids.*CLM-0*2.*coverage:.*question_count:\s*1.*addressed_count:\s*0.*qualified_count:\s*1.*unresolved_count:\s*0.*addressed_percent:\s*0\.0'
  - name: brd-builder-ordinary-request-no-proposal-extension
    prompt: |
      Resume my customer onboarding BRD and refine its stakeholder roles and
      measurable business goals. Do not create any supplemental appendix.
    tags:
      category: agent-behavior
      scenario: brd-proposal-negative
    graders:
      - type: output-matches
        name: ordinary-brd-work
        config:
          pattern: '(?i)(BRD|business goal|stakeholder|Discover|Define|Govern)'
      - type: output-matches
        name: no-proposal-extension
        config:
          pattern: '(?i)(proposal-response|RESPONSE_EVIDENCE_V1|extensionsLoaded)'
          negate: true
