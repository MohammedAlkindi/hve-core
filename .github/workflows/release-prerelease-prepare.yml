name: Pre-Release Promotion Preparation

# Opens or refreshes the reviewed main -> release/prerelease promotion pull
# request. Release preparation and creation begin only after that promotion
# merges, when release-prerelease.yml runs release-please on release/prerelease.

on:
    pull_request:
        types: [closed]
        branches:
            - main

    workflow_dispatch:

# One promotion at a time per target branch. A cancelled run could leave the
# stable per-hop promotion head half-refreshed.
concurrency:
    group: ${{ github.workflow }}-release/prerelease
    cancel-in-progress: false

# Minimal permissions for security
permissions:
    contents: read

env:
    SOURCE_BRANCH: main
    BASE_BRANCH: release/prerelease
    STABLE_BRANCH: release/stable
    PROMOTION_HEAD: release-promotion--main--to--release-prerelease
    TARGET_CONFIG: release-please-prerelease-config.json
    TARGET_MANIFEST: .release-please-prerelease-manifest.json
    STABLE_MANIFEST: .release-please-manifest.json

jobs:
    prepare-promotion:
        name: Prepare Pre-Release Promotion
        # The post-snapshot main catalog synchronization pull request must never
        # start another promotion. Excluding its head here keeps that guard ahead
        # of every branch and pull request mutation below.
        if: >
            github.event_name == 'workflow_dispatch'
            || (
              github.event.pull_request.merged == true
              && github.event.pull_request.base.ref == 'main'
              && github.event.pull_request.head.repo.full_name == github.repository
              && !startsWith(github.event.pull_request.head.ref, 'release-main-catalog-sync--v')
            )
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            promote: ${{ steps.promote.outputs.promote }}
            version: ${{ steps.resolve.outputs.version }}
            release-class: ${{ steps.classify.outputs.release-class }}
            source-sha: ${{ steps.state.outputs.source-sha }}
            prerelease-baseline: ${{ steps.state.outputs.prerelease-baseline }}
            stable-baseline: ${{ steps.read-stable-baseline.outputs.stable-baseline }}
            stable-baseline-source: ${{ steps.read-stable-baseline.outputs.baseline-source }}
        steps:
            - name: Generate GitHub App Token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.0.0
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            # Executable release tooling always comes from main, never from the
            # promotion head or from the release branch being prepared.
            - name: Checkout trusted release tooling
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  sparse-checkout: |
                      scripts/release/Resolve-ReleasePromotionVersion.ps1
                      scripts/release/Update-VersionFiles.ps1
                  sparse-checkout-cone-mode: false
                  persist-credentials: false

            # Full history: baseline reads and commit classification cover the
            # whole promoted range across main and both release branches.
            - name: Checkout promotion working tree
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  fetch-depth: 0
                  path: promotion
                  token: ${{ steps.app-token.outputs.token }}
                  persist-credentials: true

            - name: Resolve promotion state
              id: state
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  cd "$GITHUB_WORKSPACE/promotion"

                  if ! git ls-remote --exit-code --heads origin "$BASE_BRANCH" >/dev/null 2>&1; then
                    echo "::notice::$BASE_BRANCH does not exist yet; create and protect it before promotions can open"
                    echo "continue=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  git fetch --no-tags origin \
                    "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH" \
                    "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

                  SOURCE_SHA=$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")

                  if [ "$(git rev-list --count "refs/remotes/origin/$BASE_BRANCH..refs/remotes/origin/$SOURCE_BRANCH")" -eq 0 ]; then
                    echo "::notice::$SOURCE_BRANCH has no commits ahead of $BASE_BRANCH"
                    echo "continue=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  # Interlock: a managed release pull request owns the target
                  # branch until it merges, and a foreign promotion head would
                  # race this one.
                  managed_release_pr_count=$(gh pr list --base "$BASE_BRANCH" --state open \
                    --json headRefName --jq '[.[] | select(.headRefName | startswith("release-please--"))] | length' \
                    -R "$REPOSITORY")
                  if [ "$managed_release_pr_count" -ne 0 ]; then
                    echo "::notice::A managed release pull request is still open on $BASE_BRANCH"
                    echo "continue=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  foreign_promotion_pr_count=$(gh pr list --base "$BASE_BRANCH" --state open \
                    --json headRefName --jq '[.[] | select(.headRefName | startswith("release-promotion--")) | select(.headRefName != env.PROMOTION_HEAD)] | length' \
                    -R "$REPOSITORY")
                  if [ "$foreign_promotion_pr_count" -ne 0 ]; then
                    echo "::notice::Another promotion pull request is still open on $BASE_BRANCH"
                    echo "continue=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  PRERELEASE_BASELINE=$(git show "refs/remotes/origin/$BASE_BRANCH:$TARGET_MANIFEST" | jq -r '.["."] // ""')
                  if ! printf '%s' "$PRERELEASE_BASELINE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "::error::$BASE_BRANCH $TARGET_MANIFEST has no MAJOR.MINOR.PATCH version"
                    exit 1
                  fi
                  PRERELEASE_MINOR=$(printf '%s' "$PRERELEASE_BASELINE" | cut -d. -f2)
                  if (( PRERELEASE_MINOR % 2 == 0 )); then
                    echo "::error::PreRelease baseline $PRERELEASE_BASELINE has an even minor"
                    exit 1
                  fi

                  {
                    echo "continue=true"
                    echo "source-sha=$SOURCE_SHA"
                    echo "prerelease-baseline=$PRERELEASE_BASELINE"
                  } >> "$GITHUB_OUTPUT"

            # Once release/stable exists it is the only Stable baseline
            # authority: a fetch or manifest read failure aborts instead of
            # falling back to the checked-in seed.
            - name: Read Stable baseline
              id: read-stable-baseline
              if: ${{ steps.state.outputs.continue == 'true' }}
              run: |
                  set -euo pipefail
                  cd "$GITHUB_WORKSPACE/promotion"

                  if git ls-remote --exit-code --heads origin "$STABLE_BRANCH" >/dev/null 2>&1; then
                    git fetch --no-tags origin "+refs/heads/$STABLE_BRANCH:refs/remotes/origin/$STABLE_BRANCH"
                    STABLE_BASELINE=$(git show "refs/remotes/origin/$STABLE_BRANCH:$STABLE_MANIFEST" | jq -r '.["."] // ""')
                    BASELINE_SOURCE="$STABLE_BRANCH"
                  else
                    STABLE_BASELINE=$(jq -r '.["."] // ""' "$STABLE_MANIFEST")
                    BASELINE_SOURCE="checked-in seed on $SOURCE_BRANCH"
                  fi

                  if ! printf '%s' "$STABLE_BASELINE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "::error::Stable baseline from $BASELINE_SOURCE is not MAJOR.MINOR.PATCH"
                    exit 1
                  fi
                  STABLE_MINOR=$(printf '%s' "$STABLE_BASELINE" | cut -d. -f2)
                  if (( STABLE_MINOR % 2 != 0 )); then
                    echo "::error::Stable baseline $STABLE_BASELINE from $BASELINE_SOURCE has an odd minor"
                    exit 1
                  fi

                  {
                    echo "stable-baseline=$STABLE_BASELINE"
                    echo "baseline-source=$BASELINE_SOURCE"
                  } >> "$GITHUB_OUTPUT"
                  echo "Stable baseline $STABLE_BASELINE resolved from $BASELINE_SOURCE"

            - name: Classify promoted commits
              id: classify
              if: ${{ steps.state.outputs.continue == 'true' }}
              run: |
                  set -euo pipefail
                  cd "$GITHUB_WORKSPACE/promotion"

                  RANGE="refs/remotes/origin/$BASE_BRANCH..refs/remotes/origin/$SOURCE_BRANCH"

                  # Release metadata commits carry generated changelog bodies, so
                  # they never classify a promotion.
                  SUBJECTS=$(git log -E --invert-grep --grep='^chore\((main|release[^)]*)\)!?: ' --format='%s' "$RANGE")
                  BODIES=$(git log -E --invert-grep --grep='^chore\((main|release[^)]*)\)!?: ' --format='%B' "$RANGE")

                  breaking_headers=$(printf '%s\n' "$SUBJECTS" | grep -Ec '^[a-zA-Z]+(\([^)]*\))?!: ' || true)
                  breaking_footers=$(printf '%s\n' "$BODIES" | grep -Ec '^BREAKING[ -]CHANGE(\([^)]*\))?: ' || true)

                  # PreRelease advances its own patch line unless a breaking
                  # change forces the next major line.
                  if [ "$breaking_headers" -ne 0 ] || [ "$breaking_footers" -ne 0 ]; then
                    RELEASE_CLASS='major'
                  else
                    RELEASE_CLASS='patch'
                  fi

                  echo "release-class=$RELEASE_CLASS" >> "$GITHUB_OUTPUT"
                  echo "Promoted commits classified as $RELEASE_CLASS"

            - name: Resolve exact PreRelease version
              id: resolve
              if: ${{ steps.state.outputs.continue == 'true' }}
              env:
                  PRERELEASE_BASELINE: ${{ steps.state.outputs.prerelease-baseline }}
                  STABLE_BASELINE: ${{ steps.read-stable-baseline.outputs.stable-baseline }}
                  RELEASE_CLASS: ${{ steps.classify.outputs.release-class }}
              run: |
                  set -euo pipefail
                  RESOLVED=$(pwsh -NoProfile -File "$GITHUB_WORKSPACE/scripts/release/Resolve-ReleasePromotionVersion.ps1" \
                      -Channel PreRelease \
                      -CurrentPreReleaseVersion "$PRERELEASE_BASELINE" \
                      -CurrentStableVersion "$STABLE_BASELINE" \
                      -ReleaseClass "$RELEASE_CLASS" \
                      -AsJson)

                  VERSION=$(printf '%s' "$RESOLVED" | jq -r '.Version // ""')
                  if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "::error::Resolved PreRelease version $VERSION is not MAJOR.MINOR.PATCH"
                    exit 1
                  fi
                  VERSION_MINOR=$(printf '%s' "$VERSION" | cut -d. -f2)
                  if (( VERSION_MINOR % 2 == 0 )); then
                    echo "::error::Resolved PreRelease version $VERSION has an even minor"
                    exit 1
                  fi

                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Promoting $SOURCE_BRANCH to $BASE_BRANCH as $VERSION"

            - name: Refresh the promotion head
              id: promote
              if: ${{ steps.state.outputs.continue == 'true' }}
              env:
                  PRERELEASE_BASELINE: ${{ steps.state.outputs.prerelease-baseline }}
                  SOURCE_SHA: ${{ steps.state.outputs.source-sha }}
                  VERSION: ${{ steps.resolve.outputs.version }}
              run: |
                  set -euo pipefail
                  cd "$GITHUB_WORKSPACE/promotion"

                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

                  ALLOWLIST=$(printf '%s\n' \
                    'CHANGELOG.md' \
                    "$TARGET_CONFIG" \
                    "$TARGET_MANIFEST" \
                    'package.json' \
                    'package-lock.json' \
                    'extension/templates/package.template.json' \
                    '.github/plugin/marketplace.json')

                  merge_ref() {
                    local ref="$1"
                    local favor="$2"
                    if git merge --no-edit "$ref"; then
                      return 0
                    fi
                    local conflicts unexpected
                    conflicts=$(git diff --name-only --diff-filter=U)
                    unexpected=$(printf '%s\n' "$conflicts" | grep -vxF "$ALLOWLIST" || true)
                    git merge --abort
                    if [ -n "$unexpected" ]; then
                      echo "::error::Merging $ref conflicts outside release-owned files:"
                      printf '%s\n' "$unexpected"
                      exit 1
                    fi
                    # Every remaining conflict is release-owned state that the
                    # restore below rewrites from the target branch.
                    git merge --no-edit -X "$favor" "$ref"
                  }

                  if git ls-remote --exit-code --heads origin "$PROMOTION_HEAD" >/dev/null 2>&1; then
                    git fetch --no-tags origin "+refs/heads/$PROMOTION_HEAD:refs/remotes/origin/$PROMOTION_HEAD"
                    git checkout -B "$PROMOTION_HEAD" "refs/remotes/origin/$PROMOTION_HEAD"
                  else
                    git checkout -B "$PROMOTION_HEAD" "refs/remotes/origin/$BASE_BRANCH"
                  fi

                  # The per-hop head is stable: fast-forward it from the target,
                  # then merge the current source. Neither step force-updates it.
                  merge_ref "refs/remotes/origin/$BASE_BRANCH" theirs
                  merge_ref "$SOURCE_SHA" theirs

                  # Target-owned release state is restored whole, so a promotion
                  # never carries a source changelog, config, or manifest forward.
                  git checkout "refs/remotes/origin/$BASE_BRANCH" -- \
                    CHANGELOG.md "$TARGET_CONFIG" "$TARGET_MANIFEST"

                  TARGET_VERSION=$(jq -r '.["."] // ""' "$TARGET_MANIFEST")
                  if [ "$TARGET_VERSION" != "$PRERELEASE_BASELINE" ]; then
                    echo "::error::Restored $TARGET_MANIFEST is $TARGET_VERSION but the resolved baseline is $PRERELEASE_BASELINE"
                    exit 1
                  fi

                  # Shared files keep their merged source content; only the
                  # target version fields and the immutable plugin locator are
                  # restored.
                  pwsh -NoProfile -File "$GITHUB_WORKSPACE/scripts/release/Update-VersionFiles.ps1" \
                      -Version "$TARGET_VERSION" \
                      -RepoRoot "$PWD" \
                      -SkipManifest \
                      -SkipPluginGenerate

                  # Exact release intent is written last so it always reflects
                  # the restored target configuration.
                  jq --arg version "$VERSION" '.packages["."]["release-as"] = $version' \
                    "$TARGET_CONFIG" > "$TARGET_CONFIG.promotion"
                  mv "$TARGET_CONFIG.promotion" "$TARGET_CONFIG"
                  WRITTEN_INTENT=$(jq -r '.packages["."]["release-as"] // ""' "$TARGET_CONFIG")
                  if [ "$WRITTEN_INTENT" != "$VERSION" ]; then
                    echo "::error::$TARGET_CONFIG carries release-as $WRITTEN_INTENT instead of $VERSION"
                    exit 1
                  fi

                  git add --all
                  if git diff --cached --quiet; then
                    git reset --quiet
                  else
                    git commit -m "chore(release): promote $SOURCE_BRANCH to $BASE_BRANCH as $VERSION"
                  fi

                  if [ "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/$BASE_BRANCH")" ]; then
                    echo "::notice::$PROMOTION_HEAD matches $BASE_BRANCH; nothing to promote"
                    echo "promote=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  git push origin "HEAD:refs/heads/$PROMOTION_HEAD"
                  echo "promote=true" >> "$GITHUB_OUTPUT"

    open-promotion-pr:
        name: Open Pre-Release Promotion PR
        needs: [prepare-promotion]
        if: ${{ needs.prepare-promotion.outputs.promote == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Generate GitHub App Token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.0.0
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            # Auto-merge is deliberately never enabled. A human must review and
            # merge this promotion before release-please prepares the PreRelease
            # release pull request.
            - name: Open or update the promotion pull request
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  REPO: ${{ github.repository }}
                  VERSION: ${{ needs.prepare-promotion.outputs.version }}
                  HEAD_BRANCH: release-promotion--main--to--release-prerelease
                  BASE_BRANCH: release/prerelease
                  SOURCE_BRANCH: main
                  SOURCE_SHA: ${{ needs.prepare-promotion.outputs.source-sha }}
                  RELEASE_CLASS: ${{ needs.prepare-promotion.outputs.release-class }}
                  PRERELEASE_BASELINE: ${{ needs.prepare-promotion.outputs.prerelease-baseline }}
                  STABLE_BASELINE: ${{ needs.prepare-promotion.outputs.stable-baseline }}
                  STABLE_BASELINE_SOURCE: ${{ needs.prepare-promotion.outputs.stable-baseline-source }}
              run: |
                  set -euo pipefail
                  TITLE="chore(release): promote ${SOURCE_BRANCH} to ${BASE_BRANCH} as ${VERSION}"
                  BODY="## Pre-Release promotion ${VERSION}

                  Promotes \`${SOURCE_BRANCH}\` into \`${BASE_BRANCH}\` on the odd-minor pre-release line.

                  | Input | Value |
                  |-------|-------|
                  | Source commit | \`${SOURCE_SHA}\` |
                  | Release class | \`${RELEASE_CLASS}\` |
                  | PreRelease baseline | \`${PRERELEASE_BASELINE}\` |
                  | Stable baseline | \`${STABLE_BASELINE}\` (from ${STABLE_BASELINE_SOURCE}) |
                  | Exact release intent | \`${VERSION}\` |

                  Target-owned changelog, release-please config, and manifest come from
                  \`${BASE_BRANCH}\`. Shared package and catalog files keep their promoted
                  source content with only the target version fields and the immutable
                  plugin locator restored.

                  After this pull request merges, \`release-prerelease.yml\` runs
                  release-please on \`${BASE_BRANCH}\`. Release-please then opens its
                  separately reviewed release pull request, and merging that pull request
                  is the immutable \`hve-core-v${VERSION}\` tag boundary.

                  ---
                  *Managed automatically by the pre-release promotion workflow. Auto-merge is not enabled.*"

                  PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open \
                    --json number --jq '.[0].number // empty' \
                    -R "$REPO")

                  if [ -n "$PR_NUMBER" ]; then
                    gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY" -R "$REPO"
                    echo "Updated promotion PR #$PR_NUMBER for $VERSION"
                  else
                    gh pr create \
                      --head "$HEAD_BRANCH" \
                      --base "$BASE_BRANCH" \
                      --title "$TITLE" \
                      --body "$BODY" \
                      -R "$REPO"
                    echo "Created promotion PR for $VERSION"
                  fi
