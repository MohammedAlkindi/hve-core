[project]
name = "security-planning-tm7"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.3",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-mock>=3.14",
    "ruff>=0.15",
]
fuzz = [
    "atheris>=3.0",
]
windows = [
    "pillow>=11.2.1 ; platform_system == 'Windows'",
    "pywinauto>=0.6.8 ; platform_system == 'Windows'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
python_files = ["test_*.py", "fuzz_harness.py"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
