# OpenTelemetry Collector configuration for GitHub Copilot fleet telemetry.
#
# Copilot's exporter sends static headers; Azure Monitor requires rotating Entra
# credentials. This collector is what bridges the two, and it is not optional.
#
# Supply every credential and certificate path through the environment, never in
# this file:
#   export APPLICATIONINSIGHTS_CONNECTION_STRING="InstrumentationKey=...;IngestionEndpoint=..."
#   export COPILOT_OTEL_INGEST_TOKEN="<the fleet ingest token>"
#   export COPILOT_OTEL_ENVIRONMENT="prod"            # one deployment per environment
#   export COPILOT_OTEL_TLS_CERT_FILE="/etc/otel/tls/tls.crt"
#   export COPILOT_OTEL_TLS_KEY_FILE="/etc/otel/tls/tls.key"
#
# Requires the OpenTelemetry Collector Contrib distribution; the azuremonitor
# exporter is not in the core distribution.

receivers:
  otlp:
    protocols:
      # Authentication and TLS are active, not suggested. An unauthenticated
      # plaintext receiver reachable by a fleet accepts spans from anything that
      # can route to it, and every span it accepts is billed and stored.
      #
      # If TLS is terminated by an ingress controller or load balancer in front
      # of this collector, delete the tls blocks below and record that the
      # terminating hop owns certificate lifecycle and cipher policy. Do not
      # delete them merely because supplying certificates is inconvenient.
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth
        tls:
          cert_file: ${env:COPILOT_OTEL_TLS_CERT_FILE}
          key_file: ${env:COPILOT_OTEL_TLS_KEY_FILE}
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
        tls:
          cert_file: ${env:COPILOT_OTEL_TLS_CERT_FILE}
          key_file: ${env:COPILOT_OTEL_TLS_KEY_FILE}

processors:
  # Bounds collector memory so a traffic spike degrades rather than crashes it.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Six of these attributes were observed carrying plaintext content on spans
  # with github.copilot.chat.otel.captureContent set to false. The seventh,
  # copilot_chat.reasoning_content, was observed marked [encrypted] and is
  # stripped defensively. This is the only place to remove any of it before it
  # reaches billable, queryable storage. Remove an action here only as a
  # deliberate decision.
  attributes/strip-content:
    actions:
      - key: copilot_chat.user_request
        action: delete
      - key: copilot_chat.reasoning_content
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.system_instructions
        action: delete
      - key: gen_ai.tool.call.arguments
        action: delete
      - key: gen_ai.tool.call.result
        action: delete

  # Fleet dimensions for grouping. Keep these to org structure; anything that
  # identifies an individual lands on every span they produce.
  #
  # These are labels, not boundaries. An attribute set by the collector is a
  # grouping key that anyone with read access to this workspace can filter on;
  # it does not stop them reading any other environment's data. Separation comes
  # from deploying one collector and one workspace per environment, which is why
  # the environment name is a required input rather than a default.
  resource/fleet:
    attributes:
      - key: service.namespace
        value: github-copilot
        action: upsert
      - key: deployment.environment.name
        value: ${env:COPILOT_OTEL_ENVIRONMENT}
        action: upsert

  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  azuremonitor:
    connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  # Copilot can only send a fixed header set, so a static bearer token is the
  # available fleet authentication mechanism, and it is active above. Be clear
  # about what it is and is not: every workstation holds the same value, so it
  # authenticates the fleet rather than a person, it cannot be rotated for one
  # user, and anyone who extracts it from a workstation can write spans as the
  # fleet. It is write-side only, and it is still worth having, because without
  # it the receiver accepts spans from anything that can reach it.
  #
  # This authentication is mandatory, and that has a consequence worth stating
  # here rather than only in the README. Managed telemetry.headers reach the
  # extension exporter but deliberately not the agent host, because delivering
  # them through the environment would put this token inside every tool
  # subprocess the agent spawns. So the agent host exports without a
  # credential, this receiver answers 401 or UNAUTHENTICATED, and OTLP treats
  # neither as retryable: that telemetry is dropped, not queued.
  #
  # Do not resolve that by exporting the token into the environment, and do not
  # resolve it by removing this authenticator. Run a loopback relay on each
  # workstation that accepts the unauthenticated local export and adds this
  # credential upstream. See README.md, "Agent-host telemetry needs a relay".
  #
  # Mutual TLS would authenticate each workstation rather than the fleet, and
  # this receiver can already require it: adding client_ca_file beside
  # cert_file and key_file in the otlp receiver selects
  # RequireAndVerifyClientCert on both protocols. It is not enabled because
  # whether the VS Code agent host can present a client certificate is
  # unestablished, and configuring a receiver to require one the sender cannot
  # supply would replace a documented gap with fleet-wide data loss.
  bearertokenauth:
    scheme: Bearer
    token: ${env:COPILOT_OTEL_INGEST_TOKEN}

service:
  extensions: [health_check, bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/strip-content, resource/fleet, batch]
      exporters: [azuremonitor]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/fleet, batch]
      exporters: [azuremonitor]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/strip-content, resource/fleet, batch]
      exporters: [azuremonitor]
