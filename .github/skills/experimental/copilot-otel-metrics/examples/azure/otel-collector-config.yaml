# OpenTelemetry Collector configuration for GitHub Copilot fleet telemetry.
#
# Copilot's exporter sends static headers; Azure Monitor requires rotating Entra
# credentials. This collector is what bridges the two, and it is not optional.
#
# Supply every credential and certificate path through the environment, never in
# this file:
#   export APPLICATIONINSIGHTS_CONNECTION_STRING="InstrumentationKey=...;IngestionEndpoint=..."
#   export COPILOT_OTEL_INGEST_TOKEN="<the fleet ingest token>"
#   export COPILOT_OTEL_ENVIRONMENT="prod"            # one deployment per environment
#   export COPILOT_OTEL_TLS_CERT_FILE="/etc/otel/tls/tls.crt"
#   export COPILOT_OTEL_TLS_KEY_FILE="/etc/otel/tls/tls.key"
#
# Requires the OpenTelemetry Collector Contrib distribution; the azuremonitor
# exporter and the redaction processor are not in the core distribution.

receivers:
  otlp:
    protocols:
      # Authentication and TLS are active, not suggested. An unauthenticated
      # plaintext receiver reachable by a fleet accepts spans from anything that
      # can route to it, and every span it accepts is billed and stored.
      #
      # If TLS is terminated by an ingress controller or load balancer in front
      # of this collector, delete the tls blocks below and record that the
      # terminating hop owns certificate lifecycle and cipher policy. Do not
      # delete them merely because supplying certificates is inconvenient.
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth
        tls:
          cert_file: ${env:COPILOT_OTEL_TLS_CERT_FILE}
          key_file: ${env:COPILOT_OTEL_TLS_KEY_FILE}
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
        tls:
          cert_file: ${env:COPILOT_OTEL_TLS_CERT_FILE}
          key_file: ${env:COPILOT_OTEL_TLS_KEY_FILE}

processors:
  # Bounds collector memory so a traffic spike degrades rather than crashes it.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # The fleet minimization control. It is the local stack's policy verbatim,
  # and tests/test_azure_templates.py asserts that parity: a shared, retained
  # workspace is a stricter destination than one workstation, so this
  # configuration may not filter less than otel-collector-local.yaml.
  #
  # allow_all_keys: false makes allowed_keys authoritative. An attribute a
  # future emitter release introduces is dropped rather than stored, which a
  # delete-list cannot do. Adding a key here stores that attribute fleet-wide.
  redaction:
    allow_all_keys: false
    allowed_keys:
      # Resource identity. Dropping these would orphan every span.
      - service.name
      - service.namespace
      - service.version
      - telemetry.sdk.language
      - telemetry.sdk.name
      - telemetry.sdk.version
      # Model and token accounting. The token panels read these directly.
      - gen_ai.provider.name
      - gen_ai.operation.name
      - gen_ai.request.model
      - gen_ai.response.model
      - gen_ai.response.finish_reasons
      - gen_ai.usage.input_tokens
      - gen_ai.usage.output_tokens
      - gen_ai.usage.cache_read.input_tokens
      # Prometheus stores this as the gen_ai_token_type label; without it,
      # input and output tokens collapse into one indistinguishable series.
      - gen_ai.token.type
      # The discriminator baseline.py reads through the session_id label. It
      # is a detection control, not a convenience.
      - session.id
      # Agent and tool identity. Names only; arguments and results are not
      # allowed and therefore cannot reach storage.
      - gen_ai.agent.name
      - gen_ai.tool.name
      - gen_ai.tool.type
      - copilot_chat.mode_name
      - copilot_chat.turn_count
      - copilot_chat.copilot_usage_nano_aiu
      - github.copilot.agent.type
      # Both spellings collapse to the copilot_chat_edit_source label and
      # normalization is not reversible, so allow-listing both keeps a wrong
      # single guess from silently emptying the edit-acceptance panel.
      - copilot_chat.edit_source
      - copilot_chat.edit.source
      # Failure triage without failure content.
      - error.type
    # Masked, not dropped, so a panel keeps its shape while the value is gone.
    blocked_values:
      - "gh[pousr]_[0-9A-Za-z]{16,}"
      - "github_pat_[0-9A-Za-z_]{20,}"
      - "xox[baprs]-[0-9A-Za-z-]{10,}"
      - "A(?:KIA|SIA)[0-9A-Z]{16}"
      - "eyJ[0-9A-Za-z_-]{10,}\\.[0-9A-Za-z_-]{10,}\\.[0-9A-Za-z_-]*"
      - "(?i)(?:AccountKey|SharedAccessKey|SharedAccessSignature)=[0-9A-Za-z+/=%&-]{16,}"
      - "sk-(?:ant-)?[0-9A-Za-z_-]{20,}"
      - "AIza[0-9A-Za-z_-]{35}"
      - "(?i)-----BEGIN [A-Z ]*PRIVATE KEY-----"
      - "(?i)\\b(?:bearer|authorization|api[_-]?key|secret|password)\\b\\s*[:=]\\s*\\S+"
    # Silent so the processor does not annotate telemetry with the names of the
    # keys it removed, which would reintroduce the drift it exists to stop.
    summary: silent

  # Everything the redaction processor cannot reach. redaction traverses
  # attribute maps only, so span status messages, span event names, trace
  # state, and every non-map log body shape would otherwise reach the exporter
  # verbatim.
  #
  # A carrier the allow-list does not reach is scrubbed unless a shipped
  # consumer reads it. Span names, metric names, descriptions, and units are
  # absent because dashboard queries and baseline.py read them; span link
  # attributes, span link trace state, and metric exemplar filtered attributes
  # are absent because this distribution provides no way to reach them. Both
  # kinds of residual are recorded in SECURITY.md.
  transform/scrub:
    error_mode: ignore
    trace_statements:
      - set(span.status.message, "[redacted]") where span.status.message != ""
      - set(span.trace_state, "") where span.trace_state != ""
      - set(spanevent.name, "[redacted]")
    log_statements:
      - set(log.body, "[redacted]") where log.body != nil
      - set(log.severity_text, "[redacted]") where log.severity_text != ""
      - set(log.event_name, "[redacted]") where log.event_name != ""

  # Fleet dimensions for grouping. Keep these to org structure; anything that
  # identifies an individual lands on every span they produce.
  #
  # These are labels, not boundaries. An attribute set by the collector is a
  # grouping key that anyone with read access to this workspace can filter on;
  # it does not stop them reading any other environment's data. Separation comes
  # from deploying one collector and one workspace per environment, which is why
  # the environment name is a required input rather than a default.
  resource/fleet:
    attributes:
      - key: service.namespace
        value: github-copilot
        action: upsert
      - key: deployment.environment.name
        value: ${env:COPILOT_OTEL_ENVIRONMENT}
        action: upsert

  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  azuremonitor:
    connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  # Copilot can only send a fixed header set, so a static bearer token is the
  # available fleet authentication mechanism, and it is active above. Be clear
  # about what it is and is not: every workstation holds the same value, so it
  # authenticates the fleet rather than a person, it cannot be rotated for one
  # user, and anyone who extracts it from a workstation can write spans as the
  # fleet. It is write-side only, and it is still worth having, because without
  # it the receiver accepts spans from anything that can reach it.
  #
  # This authentication is mandatory, and that has a consequence worth stating
  # here rather than only in the README. Managed telemetry.headers reach the
  # extension exporter but deliberately not the agent host, because delivering
  # them through the environment would put this token inside every tool
  # subprocess the agent spawns. So the agent host exports without a
  # credential, this receiver answers 401 or UNAUTHENTICATED, and OTLP treats
  # neither as retryable: that telemetry is dropped, not queued.
  #
  # Do not resolve that by exporting the token into the environment, and do not
  # resolve it by removing this authenticator. Run a loopback relay on each
  # workstation that accepts the unauthenticated local export and adds this
  # credential upstream. See README.md, "Agent-host telemetry needs a relay".
  #
  # Mutual TLS would authenticate each workstation rather than the fleet, and
  # this receiver can already require it: adding client_ca_file beside
  # cert_file and key_file in the otlp receiver selects
  # RequireAndVerifyClientCert on both protocols. It is not enabled because
  # whether the VS Code agent host can present a client certificate is
  # unestablished, and configuring a receiver to require one the sender cannot
  # supply would replace a documented gap with fleet-wide data loss.
  bearertokenauth:
    scheme: Bearer
    token: ${env:COPILOT_OTEL_INGEST_TOKEN}

service:
  extensions: [health_check, bearertokenauth]
  pipelines:
    # resource/fleet runs after filtering so operator-owned environment
    # identity survives the allow-list without the allow-list having to trust
    # client-supplied dimensions.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction, transform/scrub, resource/fleet, batch]
      exporters: [azuremonitor]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, redaction, transform/scrub, resource/fleet, batch]
      exporters: [azuremonitor]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction, transform/scrub, resource/fleet, batch]
      exporters: [azuremonitor]
