# OpenTelemetry Collector configuration for the local Copilot stack.
#
# This Collector is the only OTLP listener published on the host. It sits in
# front of the LGTM container, which has no host OTLP mapping, so nothing
# reaches storage without passing through the policy declared here.
#
# The policy is fail-closed: allowed_keys is an allow-list, so an attribute
# this configuration has never heard of is dropped rather than stored. That
# matters because the emitter's attribute set is not a stable contract. A
# future extension release can add a new prompt-bearing attribute, and a
# delete-list would silently pass it through while this allow-list will not.
#
# Requires the OpenTelemetry Collector Contrib distribution; the redaction
# processor is not in the core distribution.

receivers:
  otlp:
    protocols:
      # Bound to the container interface. Host exposure is decided by the
      # loopback port mappings in compose.yaml, not here.
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Bounds Collector memory so a traffic spike degrades rather than crashes it.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # The entire minimization control for the local stack.
  #
  # allow_all_keys: false makes allowed_keys authoritative. Every key below
  # exists because a shipped dashboard panel or a datasource lookup reads it.
  # Adding a key here is a deliberate decision to store that attribute; the
  # content attributes that were observed carrying plaintext are absent by
  # construction rather than by enumeration.
  #
  # blocked_values is a second, independent pass over the values that survive.
  # An allowed key can still carry a credential pasted into a model name or a
  # tool argument, so recognizable secret shapes are masked rather than stored.
  redaction:
    allow_all_keys: false
    allowed_keys:
      # Resource identity. Dropping these would orphan every span.
      - service.name
      - service.namespace
      - service.version
      - telemetry.sdk.language
      - telemetry.sdk.name
      - telemetry.sdk.version
      # Model and token accounting. The token panels read these directly.
      - gen_ai.provider.name
      - gen_ai.operation.name
      - gen_ai.request.model
      - gen_ai.response.model
      - gen_ai.response.finish_reasons
      - gen_ai.usage.input_tokens
      - gen_ai.usage.output_tokens
      - gen_ai.usage.cache_read.input_tokens
      # The token panels group by this. Prometheus stores it as the
      # gen_ai_token_type label; dropping it collapsed input and output tokens
      # into one indistinguishable series.
      - gen_ai.token.type
      # Read by baseline.py through the session_id label. It is the
      # discriminator that distinguishes injected series from real ones, so
      # dropping it disabled a detection control the threat model credits.
      - session.id
      # Agent and tool identity. Names only; arguments and results are not
      # allowed and therefore cannot reach storage.
      - gen_ai.agent.name
      - gen_ai.tool.name
      - gen_ai.tool.type
      - copilot_chat.mode_name
      - copilot_chat.turn_count
      - copilot_chat.copilot_usage_nano_aiu
      - github.copilot.agent.type
      # The edit-acceptance panel groups by the copilot_chat_edit_source label.
      # Which OTLP key produces that label is not established: normalization to
      # a Prometheus label is not reversible, and both spellings below collapse
      # to it. Allow-listing both means a wrong single guess cannot silently
      # empty the panel. Settling this needs live emitter output, and the gap
      # is recorded in SECURITY.md rather than guessed away here.
      - copilot_chat.edit_source
      - copilot_chat.edit.source
      # Failure triage without failure content.
      - error.type
    # Masked, not dropped, so a panel keeps its shape while the value is gone.
    blocked_values:
      - "gh[pousr]_[0-9A-Za-z]{16,}"
      - "github_pat_[0-9A-Za-z_]{20,}"
      - "xox[baprs]-[0-9A-Za-z-]{10,}"
      - "AKIA[0-9A-Z]{16}"
      - "eyJ[0-9A-Za-z_-]{10,}\\.[0-9A-Za-z_-]{10,}\\.[0-9A-Za-z_-]{10,}"
      - "(?i)-----BEGIN [A-Z ]*PRIVATE KEY-----"
      - "(?i)\\b(?:bearer|authorization|api[_-]?key|secret|password)\\b\\s*[:=]\\s*\\S+"
    # Silent so the processor does not annotate telemetry with the names of the
    # keys it removed, which would reintroduce the drift it exists to stop.
    summary: silent

  # Everything the redaction processor cannot reach.
  #
  # redaction traverses attribute maps. Running the pinned Collector against
  # payloads that placed a distinct marker in every OTLP carrier showed which
  # carriers that leaves open: span status messages, span event names, trace
  # state, and every log body shape except a map all reached the exporter
  # verbatim. An allow-list that never sees a field cannot fail closed on it,
  # so those carriers are overwritten here.
  #
  # The rule is: a carrier the allow-list does not reach is scrubbed unless a
  # shipped consumer reads it. That is why span names are absent from this
  # list even though they are the carrier most likely to hold prompt text.
  # Three dashboard queries match on span name and baseline.py reads Tempo's
  # rootTraceName, so scrubbing them would break shipped functionality. Metric
  # names, descriptions, and units are absent for the same reason. Those
  # residual exposures are recorded in SECURITY.md rather than hidden here.
  #
  # Span link attributes, span link trace state, and metric exemplar filtered
  # attributes are also open and are also absent, but for a different reason:
  # this distribution provides no way to reach them. OTTL has no `spanlink`
  # context and refuses to index `links`, and assigning to `datapoint.exemplars`
  # parses but does nothing. Both are recorded as gaps.
  transform/scrub:
    error_mode: ignore
    trace_statements:
      - set(span.status.message, "[redacted]") where span.status.message != ""
      - set(span.trace_state, "") where span.trace_state != ""
      - set(spanevent.name, "[redacted]")
    log_statements:
      - set(log.body, "[redacted]") where log.body != nil
      - set(log.severity_text, "[redacted]") where log.severity_text != ""
      - set(log.event_name, "[redacted]") where log.event_name != ""

  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  # The LGTM container is reachable only on the internal Compose network. TLS
  # is not used on that hop and the insecure flag says so explicitly rather
  # than leaving it to a default.
  #
  # `otlp_grpc` rather than `otlp`: the pinned Collector logs a deprecation
  # warning for the `otlp` exporter alias once per signal at every start.
  otlp_grpc/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction, transform/scrub, batch]
      exporters: [otlp_grpc/lgtm]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, redaction, transform/scrub, batch]
      exporters: [otlp_grpc/lgtm]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction, transform/scrub, batch]
      exporters: [otlp_grpc/lgtm]
